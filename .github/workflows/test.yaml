name: test
on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - "1.27"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ matrix.go }}

      - name: go test
        run: |
          go test -race ./...

  aws-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Setup AWS Emulator
        uses: shogo82148/actions-setup-aws-emulator@v0.1.0
        with:
          aws-emulator-version: "1.0.508"
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: go test
        env:
          SETS3LOCK_TEST_BUCKET: sets3lock
        run: |
          aws s3 mb "s3://$SETS3LOCK_TEST_BUCKET"
          go test -race ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: stable
      - name: Check GoReleaser configure
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: "~> v2"
          args: check
